# nginx DENTRO del contenedor: sirve el build estático de Astro.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Detrás del proxy del servidor: redirecciones relativas (nunca exponer :80 / :7010)
    absolute_redirect off;
    port_in_redirect off;
    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml application/xml text/xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Assets con hash (CSS/JS/fuentes): caché de 1 año
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Imágenes e íconos: 1 semana
    location = /site.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=604800";
    }

    location ~* \.(png|svg|ico|webp|avif|jpg|jpeg)$ {
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /llms.txt { default_type "text/plain; charset=utf-8"; }
    location = /robots.txt { default_type "text/plain; charset=utf-8"; }

    # HTML: siempre revalidar (para que un build nuevo se vea al instante)
    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        # /canchas → 301 /canchas/ (una sola URL por página, evita contenido duplicado)
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
