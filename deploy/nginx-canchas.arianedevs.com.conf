# nginx DEL SERVIDOR (EC2) — copiar a /etc/nginx/sites-available/canchas.arianedevs.com
# y activar con:  sudo ln -s /etc/nginx/sites-available/canchas.arianedevs.com /etc/nginx/sites-enabled/
# Luego:          sudo nginx -t && sudo systemctl reload nginx
# HTTPS:          sudo certbot --nginx -d canchas.arianedevs.com   (certbot agrega el bloque 443 y la redirección)

server {
    listen 80;
    listen [::]:80;
    server_name canchas.arianedevs.com;

    location / {
        proxy_pass http://127.0.0.1:7010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

